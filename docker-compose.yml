version: '3.8'

services:
  qwen-image-edit-api:
    build: .
    container_name: qwen-image-edit-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for models and cache
      - ./data/models:/data/models
      - ./data/logs:/data/logs
      - ./data/cache:/data/cache
      - ./data/torch:/data/torch
      # Mount config files
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
